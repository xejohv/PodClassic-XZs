name: build-release

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > podclassic.keystore
          else
            echo "no keystore secret, will sign with debug key"
          fi

      - name: Write local.properties
        env:
          POD_STORE_PASSWORD: ${{ secrets.POD_STORE_PASSWORD }}
          POD_KEY_PASSWORD: ${{ secrets.POD_KEY_PASSWORD }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            if [ -f podclassic.keystore ]; then
              echo "pod.storePassword=$POD_STORE_PASSWORD"
              echo "pod.keyAlias=podclassic"
              echo "pod.keyPassword=$POD_KEY_PASSWORD"
            fi
          } > local.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PodClassicXZs-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
